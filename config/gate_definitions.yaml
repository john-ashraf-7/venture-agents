# Desk-evidence gate (end of Phase 1). These defaults are copied into a run's gate rule at
# intake, shown to the founder, then LOCKED (sha256 + timestamp) before any research runs.
desk_gate:
  demand_signals_min: 1   # lowered from 3 on 2026-11-17 (founder decision); committed before the runs that use it
  paying_competitors_min: 1
  direct_competitors_max: 4
  blocking_compliance_flags_max: 0
  founder_fit:
    compare: high_end_of_estimate     # cost/hours estimates are ASSUMPTION ranges; compare the HIGH end
    require_skills: true
  # A demand signal counts only from these community sites (suffix match on the host), and only when the
  # quote is a first-person problem statement with a date. Articles, galleries and vendor blogs never count.
  community_domains: [reddit.com, news.ycombinator.com, stackexchange.com, stackoverflow.com, superuser.com,
                      askubuntu.com, indiehackers.com, producthunt.com/discussions, quora.com, techcommunity.microsoft.com]
  # Who decides whether a quote is demand: "llm" = the demand classifier judges any page (no site or date rule);
  # "strict" = also require a community site, a first-person pronoun and a source date. Quotes must always
  # appear word for word in the source text.
  demand_judged_by: llm
  # Below this research coverage, weak demand means "not searchable", not "no demand": the gate says PARK, never STOP.
  coverage_min: { pages_read: 5, verifiable_sources: 1 }
  counts_only:
    labels: [SUPPORTED]
    checked_by_different_family: true
  change_our_mind: >-
    We would change the recommendation if at least {demand_signals_min} dated, sourced demand
    signals and {paying_competitors_min} competitor with a verified public price were found,
    with no blocking compliance flag and a plan that fits the founder's budget and time.

definitions:
  demand_signal: >-
    A SUPPORTED claim, backed by a fetched source, of one of: a first-person problem statement with
    a date, on a site in community_domains (articles, template galleries and vendor blogs never
    count); an existing paid product with a public pricing page; a sourced trend whose quote
    contains a figure or date (at most one trend counts). Search-snippet claims are PARTIAL and
    never count.
  paying_competitor: >-
    A competitor whose price was read from its own fetched page and verified by the claim checker.
  direct_competitor: >-
    Same buyer, same job, same channel as the founder's idea.
  blocking_compliance_flag: >-
    The idea falls in an excluded category (physical goods, financial/crypto, health or legal
    advice) or needs a licence the founder does not have.

verdict_mapping:   # applied in code (app/gates.py), first matching row wins
  - { when: compliance_flag, verdict: STOP }
  - { when: demand_below_half_of_min_and_low_coverage, verdict: PARK }   # coverage_min
  - { when: demand_below_half_of_min, verdict: STOP }
  - { when: demand_below_min, verdict: PARK }
  - { when: no_paying_competitor, verdict: PARK }
  - { when: too_many_direct_competitors, verdict: PIVOT_BACK }
  - { when: founder_fit_fails, verdict: PARK }
  - { when: all_pass, verdict: GO }

experiment_gate:
  default_window_days: 14
  default_min_visitors: 500
  default_signups_threshold: 100
  excluded_sources: [demo_audience, simulated]

tests_gate:
  max_attempts: 3

quality:
  min_score: 0.6
  max_revisions: 2
