# Model layer configuration. Agents never name a model; they name a ROLE.
# Select a profile with PROFILE=<name>; override one role with ROLE_<ROLE_NAME>=<model-key>.
#
# ref_usd_per_mtok = reference price of a comparable HOSTED open-weight model, used only to
# show what a run would cost if it were not run locally (ASSUMPTION, see README "Cost per run").
# Local runs cost $0.00 in API fees.

providers:
  ollama: { kind: ollama, base_url: "http://ollama:11434" }   # native API (passes num_ctx + JSON schema)
  openai_compat: { kind: openai, base_url: "http://ollama:11434/v1" }  # any OpenAI-compatible server
  # Small models run inside the app container with Hugging Face transformers (weights cached in the
  # hf_cache volume, downloaded once). device: auto = GPU if visible, else CPU.
  local_transformers: { kind: local_transformers }

models:
  gpt-oss-20b:
    provider: ollama
    name: "gpt-oss:20b"
    family: gpt-oss
    num_ctx: 16384
    vram_gb_est: 14
    think: low
    ref_usd_per_mtok: { in: 0.05, out: 0.20 }
  qwen-8b:
    provider: ollama
    name: "qwen3:8b"
    family: qwen
    num_ctx: 8192
    vram_gb_est: 6
    think: false
    ref_usd_per_mtok: { in: 0.035, out: 0.138 }
  # Fallback for machines that already have qwen2.5 pulled (select with ROLE_<NAME>=qwen25-7b).
  qwen25-7b:
    provider: ollama
    name: "qwen2.5:7b"
    family: qwen
    num_ctx: 8192
    vram_gb_est: 5
    ref_usd_per_mtok: { in: 0.03, out: 0.10 }
  gpt-oss-safeguard-20b:
    provider: ollama
    name: "gpt-oss-safeguard:20b"
    family: gpt-oss-safeguard
    num_ctx: 8192
    vram_gb_est: 14
    think: low
    ref_usd_per_mtok: { in: 0.075, out: 0.30 }
  minicheck-flan-t5:
    provider: local_transformers
    name: "lytang/MiniCheck-Flan-T5-Large"   # MIT; fact-checking grounding model (claim given a document)
    family: flan-t5
    license: MIT
    device: auto
    fp16: false            # T5 overflows in fp16; fp32 on GPU is ~3 GB
    num_ctx: 2048          # max input tokens per (chunk, claim) pair
    vram_gb_est: 3
    ref_usd_per_mtok: { in: 0.0, out: 0.0 }
  bge-reranker-v2-m3:
    provider: local_transformers
    name: "BAAI/bge-reranker-v2-m3"          # Apache-2.0; multilingual cross-encoder
    family: bge
    license: Apache-2.0
    device: cpu            # set to auto/cuda to use the GPU (RERANKER_DEVICE env overrides)
    fp16: true
    num_ctx: 512
    vram_gb_est: 0
    ref_usd_per_mtok: { in: 0.0, out: 0.0 }
  embed:
    provider: ollama
    name: "nomic-embed-text"
    family: nomic
    vram_gb_est: 1
    ref_usd_per_mtok: { in: 0.0, out: 0.0 }

roles:
  intake:           { model: gpt-oss-20b, temperature: 0.2 }
  planner:          { model: gpt-oss-20b, temperature: 0.2 }
  idea_scout:       { model: gpt-oss-20b, temperature: 0.7 }
  page_reader:      { model: gpt-oss-20b, temperature: 0.0, checks: null }   # evals/results/page_reader.md: same speed, half the invented values; output is code-verified
  claim_extractor:  { model: gpt-oss-20b, temperature: 0.0 }
  # MiniCheck support probability -> label: >= t_high SUPPORTED, >= t_low PARTIAL, else UNSUPPORTED
  # (tuned on evals/labeled/claims.json, evals/results/minicheck_thresholds.json). The Qwen prompt
  # checker stays selectable: ROLE_CLAIM_CHECKER=qwen-8b (or qwen25-7b).
  claim_checker:    { model: minicheck-flan-t5, temperature: 0.0, escalate_to: null, checks: claim_extractor, t_high: 0.9, t_low: 0.5, top_chunks: 3, chunk_words: 300 }
  reranker:         { model: bge-reranker-v2-m3, temperature: 0.0 }   # app/services/rerank.py (not wired into search yet)
  devils_advocate:  { model: qwen-8b,     temperature: 0.5 }
  gate_explainer:   { model: gpt-oss-20b, temperature: 0.1 }
  policy_guard:     { model: qwen-8b,     temperature: 0.0, policy_file: config/policy.md, checks: copywriter }
  copywriter:       { model: gpt-oss-20b, temperature: 0.7 }
  builder:          { model: gpt-oss-20b, temperature: 0.2 }
  test_writer:      { model: qwen-8b,     temperature: 0.2 }
  analyst:          { model: gpt-oss-20b, temperature: 0.2 }
  coach:            { model: qwen-8b,     temperature: 0.3 }
  judge:            { model: qwen-8b,     temperature: 0.0, checks: builder }   # evals only

profiles:
  # Live 3-minute demo: tight caps, claim checking only on gate-feeding claims.
  demo-fast:
    caps: { results_per_query: 5, max_queries: 3, max_pages: 5, page_chars: 6000, demand_queries: 4, competitor_queries: 2, pricing_queries: 2 }
    check_scope: gate
  # Slower, larger caps, checker escalates to gpt-oss-20b when Qwen fails validation.
  quality:
    caps: { results_per_query: 8, max_queries: 6, max_pages: 12, page_chars: 12000, demand_queries: 8, competitor_queries: 3, pricing_queries: 3 }
    check_scope: all
    role_overrides:
      claim_checker: { escalate_to: gpt-oss-20b }   # used only when claim_checker is an LLM (Qwen) checker
  # Optional: Policy Guard on gpt-oss-safeguard:20b (loaded one after another, not beside gpt-oss-20b).
  safeguard:
    caps: { results_per_query: 5, max_queries: 3, max_pages: 5, page_chars: 6000, demand_queries: 4, competitor_queries: 2, pricing_queries: 2 }
    check_scope: gate
    role_overrides:
      policy_guard: { model: gpt-oss-safeguard-20b }
