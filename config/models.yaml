# Model layer configuration. Agents never name a model; they name a ROLE.
# Select a profile with PROFILE=<name>; override one role with ROLE_<ROLE_NAME>=<model-key>.
#
# ref_usd_per_mtok = reference price of a comparable HOSTED open-weight model, used only to
# show what a run would cost if it were not run locally (ASSUMPTION, see README "Cost per run").
# Local runs cost $0.00 in API fees.
#
# VRAM: keep_alive (optional, per model) unloads what the current step does not need. On a 24 GB card
# (gpt-oss-20b + a small Qwen via ROLE_* overrides) gpt-oss-20b stays loaded through Phase 1 and the small
# checkers unload soon after their burst. num_ctx is per MODEL, not per role: Ollama reloads a model
# whenever num_ctx changes between calls, so a per-role cap on a shared model would cost a reload.
# Ollama server env (docker-compose.yml / native install): OLLAMA_MAX_LOADED_MODELS=3,
# OLLAMA_FLASH_ATTENTION=1, OLLAMA_KV_CACHE_TYPE=q8_0.

providers:
  ollama: { kind: ollama, base_url: "http://ollama:11434" }   # native API (passes num_ctx + JSON schema)
  openai_compat: { kind: openai, base_url: "http://ollama:11434/v1" }  # any OpenAI-compatible server
  # Small models run inside the app container with Hugging Face transformers (weights cached in the
  # hf_cache volume, downloaded once). device: auto = GPU if visible, else CPU.
  local_transformers: { kind: local_transformers }

models:
  # Default writer (~65 GB, pulled by ollama-pull; needs a large GPU such as 80 GB).
  gpt-oss-120b:
    provider: ollama
    name: "gpt-oss:120b"
    family: gpt-oss
    num_ctx: 16384
    vram_gb_est: 65
    think: low
    ref_usd_per_mtok: { in: 0.15, out: 0.60 }
  gpt-oss-20b:
    provider: ollama
    name: "gpt-oss:20b"
    family: gpt-oss
    keep_alive: "15m"
    num_ctx: 16384
    vram_gb_est: 14
    think: low
    ref_usd_per_mtok: { in: 0.05, out: 0.20 }
  qwen-8b:
    provider: ollama
    name: "qwen3:8b"
    family: qwen
    keep_alive: "3m"
    num_ctx: 8192
    vram_gb_est: 6
    think: false
    ref_usd_per_mtok: { in: 0.035, out: 0.138 }
  # Default checker family (~20 GB, pulled by ollama-pull): Qwen checks what gpt-oss-120b writes.
  qwen3-32b:
    provider: ollama
    name: "qwen3:32b"
    family: qwen
    num_ctx: 16384
    vram_gb_est: 20
    think: false
    ref_usd_per_mtok: { in: 0.10, out: 0.30 }
  # Fallback for machines that already have qwen2.5 pulled (select with ROLE_<NAME>=qwen25-7b).
  qwen25-7b:
    provider: ollama
    name: "qwen2.5:7b"
    family: qwen
    keep_alive: "3m"
    num_ctx: 8192
    vram_gb_est: 5
    ref_usd_per_mtok: { in: 0.03, out: 0.10 }
  gpt-oss-safeguard-20b:
    provider: ollama
    name: "gpt-oss-safeguard:20b"
    family: gpt-oss-safeguard
    num_ctx: 8192
    vram_gb_est: 14
    think: low
    ref_usd_per_mtok: { in: 0.075, out: 0.30 }
  granite-guardian-8b:
    provider: ollama
    name: "ibm/granite4.1-guardian:8b"       # Apache-2.0; answers yes/no per criterion (config/policy_criteria.yaml)
    family: granite-guardian
    license: Apache-2.0
    keep_alive: "3m"
    num_ctx: 8192
    vram_gb_est: 7
    think: false
    ref_usd_per_mtok: { in: 0.03, out: 0.10 }
  minicheck-flan-t5:
    provider: local_transformers
    name: "lytang/MiniCheck-Flan-T5-Large"   # MIT; fact-checking grounding model (claim given a document)
    family: flan-t5
    license: MIT
    device: auto
    dtype: bfloat16        # on GPU (T5 overflows in fp16; bf16 ~1.6 GB); CPU always runs float32
    num_ctx: 2048          # max input tokens per (chunk, claim) pair
    vram_gb_est: 1.6
    ref_usd_per_mtok: { in: 0.0, out: 0.0 }
  bge-reranker-v2-m3:
    provider: local_transformers
    name: "BAAI/bge-reranker-v2-m3"          # Apache-2.0; multilingual cross-encoder
    family: bge
    license: Apache-2.0
    device: cpu            # set to auto/cuda to use the GPU (RERANKER_DEVICE env overrides)
    dtype: float16         # on GPU only
    num_ctx: 512
    vram_gb_est: 0
    ref_usd_per_mtok: { in: 0.0, out: 0.0 }
  embed:
    provider: ollama
    name: "nomic-embed-text"
    family: nomic
    vram_gb_est: 1
    ref_usd_per_mtok: { in: 0.0, out: 0.0 }

roles:
  # Defaults on a 24 GB RTX 3090: writers and page reader on gpt-oss-20b; the claim checker and demand classifier
  # (the judges that decide what counts) on qwen3-32b, the other checkers on qwen2.5:7b; Qwen is a different family. PULL_MODELS pulls these two (~18 GB). Bigger models are opt-in:
  # PROFILE=quality (gpt-oss-120b writes, qwen3-32b checks; ~85 GB, an 80 GB GPU) with PULL_MODELS to match.
  intake:           { model: gpt-oss-20b,  temperature: 0.2 }
  planner:          { model: gpt-oss-20b,  temperature: 0.2 }
  idea_scout:       { model: gpt-oss-20b,  temperature: 0.7 }
  page_reader:      { model: gpt-oss-20b,  temperature: 0.0, checks: null }   # output is code-verified (quotes, names, prices must be on the page)
  claim_extractor:  { model: gpt-oss-20b,  temperature: 0.0 }
  # Claim checker alternative: ROLE_CLAIM_CHECKER=minicheck-flan-t5 (MiniCheck in the app container; label bands
  # t_high / t_low below, to be tuned on evals/labeled/claims.json -> evals/results/minicheck_thresholds.json).
  claim_checker:    { model: qwen3-32b,  temperature: 0.0, escalate_to: null, checks: claim_extractor, t_high: 0.9, t_low: 0.5, top_chunks: 3, chunk_words: 300 }
  reranker:         { model: bge-reranker-v2-m3, temperature: 0.0 }   # app/services/rerank.py (not wired into search yet)
  devils_advocate:  { model: qwen25-7b,    temperature: 0.5 }
  gate_explainer:   { model: gpt-oss-20b,  temperature: 0.1 }
  policy_guard:     { model: qwen25-7b,    temperature: 0.0, policy_file: config/policy.md, checks: copywriter }
  copywriter:       { model: gpt-oss-20b,  temperature: 0.7 }
  builder:          { model: gpt-oss-20b,  temperature: 0.2 }
  test_writer:      { model: qwen25-7b,    temperature: 0.2 }
  analyst:          { model: gpt-oss-20b,  temperature: 0.2 }
  coach:            { model: qwen25-7b,    temperature: 0.3 }
  judge:            { model: qwen25-7b,    temperature: 0.0, checks: builder }   # evals only
  demand_classifier: { model: qwen3-32b, temperature: 0.0, checks: claim_extractor }   # is a community post a first-person statement of the brief's problem?

profiles:
  # Live 3-minute demo: tight caps, claim checking only on gate-feeding claims.
  demo-fast:
    caps: { results_per_query: 5, max_queries: 3, max_pages: 5, page_chars: 6000, demand_queries: 4, competitor_queries: 2, pricing_queries: 2 }
    check_scope: gate
  # Opt-in big models (~85 GB: PULL_MODELS="gpt-oss:120b qwen3:32b nomic-embed-text", an 80 GB GPU), larger caps,
  # every claim checked. Writers on gpt-oss-120b; page reader and checkers on qwen3-32b (different family);
  # the checker escalates to gpt-oss-120b when Qwen fails validation. Not used for any committed run.
  quality:
    caps: { results_per_query: 8, max_queries: 6, max_pages: 12, page_chars: 12000, demand_queries: 8, competitor_queries: 3, pricing_queries: 3 }
    check_scope: all
    role_overrides:
      intake: { model: gpt-oss-120b }
      planner: { model: gpt-oss-120b }
      idea_scout: { model: gpt-oss-120b }
      claim_extractor: { model: gpt-oss-120b }
      gate_explainer: { model: gpt-oss-120b }
      copywriter: { model: gpt-oss-120b }
      builder: { model: gpt-oss-120b }
      analyst: { model: gpt-oss-120b }
      page_reader: { model: qwen3-32b }
      claim_checker: { model: qwen3-32b, escalate_to: gpt-oss-120b }
      devils_advocate: { model: qwen3-32b }
      policy_guard: { model: qwen3-32b }
      test_writer: { model: qwen3-32b }
      coach: { model: qwen3-32b }
      judge: { model: qwen3-32b }
      demand_classifier: { model: qwen3-32b }
  # Optional: Policy Guard on gpt-oss-safeguard:20b (loaded one after another, not beside gpt-oss-20b).
  safeguard:
    caps: { results_per_query: 5, max_queries: 3, max_pages: 5, page_chars: 6000, demand_queries: 4, competitor_queries: 2, pricing_queries: 2 }
    check_scope: gate
    role_overrides:
      policy_guard: { model: gpt-oss-safeguard-20b }
