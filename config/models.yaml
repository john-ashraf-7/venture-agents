# Model layer configuration. Agents never name a model; they name a ROLE.
# Select a profile with PROFILE=<name>; override one role with ROLE_<ROLE_NAME>=<model-key>.
#
# ref_usd_per_mtok = reference price of a comparable HOSTED open-weight model, used only to
# show what a run would cost if it were not run locally (ASSUMPTION, see README "Cost per run").
# Local runs cost $0.00 in API fees.

providers:
  ollama: { kind: ollama, base_url: "http://ollama:11434" }   # native API (passes num_ctx + JSON schema)
  openai_compat: { kind: openai, base_url: "http://ollama:11434/v1" }  # any OpenAI-compatible server

models:
  # Default writer (~65 GB, pulled by ollama-pull; needs a large GPU such as 80 GB).
  gpt-oss-120b:
    provider: ollama
    name: "gpt-oss:120b"
    family: gpt-oss
    num_ctx: 16384
    vram_gb_est: 65
    think: low
    ref_usd_per_mtok: { in: 0.15, out: 0.60 }
  gpt-oss-20b:
    provider: ollama
    name: "gpt-oss:20b"
    family: gpt-oss
    num_ctx: 16384
    vram_gb_est: 14
    think: low
    ref_usd_per_mtok: { in: 0.05, out: 0.20 }
  qwen-8b:
    provider: ollama
    name: "qwen3:8b"
    family: qwen
    num_ctx: 8192
    vram_gb_est: 6
    think: false
    ref_usd_per_mtok: { in: 0.035, out: 0.138 }
  # Default checker family (~20 GB, pulled by ollama-pull): Qwen checks what gpt-oss-120b writes.
  qwen3-32b:
    provider: ollama
    name: "qwen3:32b"
    family: qwen
    num_ctx: 16384
    vram_gb_est: 20
    think: false
    ref_usd_per_mtok: { in: 0.10, out: 0.30 }
  # Fallback for machines that already have qwen2.5 pulled (select with ROLE_<NAME>=qwen25-7b).
  qwen25-7b:
    provider: ollama
    name: "qwen2.5:7b"
    family: qwen
    num_ctx: 8192
    vram_gb_est: 5
    ref_usd_per_mtok: { in: 0.03, out: 0.10 }
  gpt-oss-safeguard-20b:
    provider: ollama
    name: "gpt-oss-safeguard:20b"
    family: gpt-oss-safeguard
    num_ctx: 8192
    vram_gb_est: 14
    think: low
    ref_usd_per_mtok: { in: 0.075, out: 0.30 }
  embed:
    provider: ollama
    name: "nomic-embed-text"
    family: nomic
    vram_gb_est: 1
    ref_usd_per_mtok: { in: 0.0, out: 0.0 }

roles:
  # Big-model defaults: writers on gpt-oss-120b; the page reader and every checker (claim_checker, policy_guard,
  # judge) on qwen3-32b, a different family. PULL_MODELS pulls these two (~85 GB). Smaller machines: override per
  # role in .env (e.g. ROLE_INTAKE=gpt-oss-20b, ROLE_CLAIM_CHECKER=qwen-8b) and set PULL_MODELS to match.
  intake:           { model: gpt-oss-120b, temperature: 0.2 }
  planner:          { model: gpt-oss-120b, temperature: 0.2 }
  idea_scout:       { model: gpt-oss-120b, temperature: 0.7 }
  page_reader:      { model: qwen3-32b,    temperature: 0.0, checks: null }   # output is code-verified (quotes, names, prices must be on the page)
  claim_extractor:  { model: gpt-oss-120b, temperature: 0.0 }
  claim_checker:    { model: qwen3-32b,    temperature: 0.0, escalate_to: null, checks: claim_extractor }
  devils_advocate:  { model: qwen3-32b,    temperature: 0.5 }
  gate_explainer:   { model: gpt-oss-120b, temperature: 0.1 }
  policy_guard:     { model: qwen3-32b,    temperature: 0.0, policy_file: config/policy.md, checks: copywriter }
  copywriter:       { model: gpt-oss-120b, temperature: 0.7 }
  builder:          { model: gpt-oss-120b, temperature: 0.2 }
  test_writer:      { model: qwen3-32b,    temperature: 0.2 }
  analyst:          { model: gpt-oss-120b, temperature: 0.2 }
  coach:            { model: qwen3-32b,    temperature: 0.3 }
  judge:            { model: qwen3-32b,    temperature: 0.0, checks: builder }   # evals only

profiles:
  # Live 3-minute demo: tight caps, claim checking only on gate-feeding claims.
  demo-fast:
    caps: { results_per_query: 5, max_queries: 3, max_pages: 5, page_chars: 6000, demand_queries: 4, competitor_queries: 2, pricing_queries: 2 }
    check_scope: gate
  # Slower, larger caps, every claim checked; the checker escalates to gpt-oss-120b when Qwen fails validation.
  quality:
    caps: { results_per_query: 8, max_queries: 6, max_pages: 12, page_chars: 12000, demand_queries: 8, competitor_queries: 3, pricing_queries: 3 }
    check_scope: all
    role_overrides:
      claim_checker: { escalate_to: gpt-oss-120b }
  # Optional: Policy Guard on gpt-oss-safeguard:20b (loaded one after another, not beside gpt-oss-20b).
  safeguard:
    caps: { results_per_query: 5, max_queries: 3, max_pages: 5, page_chars: 6000, demand_queries: 4, competitor_queries: 2, pricing_queries: 2 }
    check_scope: gate
    role_overrides:
      policy_guard: { model: gpt-oss-safeguard-20b }
