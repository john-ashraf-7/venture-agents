# Layer 1 of the Policy Guard: deterministic rules.
# action: block -> refused outright (obvious cases); flag -> sent to the policy_guard model (layer 2).
# Patterns are case-insensitive Python regexes.
rules:
  - id: fake_reviews_count
    action: block
    pattern: '\b(write|generate|create|make|draft|give me|produce)\b.{0,40}\b(\d+|some|a few|several|many|fifty|ten|twenty|hundred)\b.{0,30}\b(reviews?|testimonials?|ratings?|endorsements?)\b'
  - id: fake_reviews_stars
    action: block
    pattern: '\b(5|five)[- ]?stars?\b.{0,30}\b(reviews?|ratings?|feedback|comments?)\b'
  - id: testimonials_from_users
    action: block
    pattern: '\btestimonials?\b.{0,40}\b(beta|users?|customers?|clients?)\b'
  - id: multilingual_reviews
    action: block
    pattern: '((\d+|cinco|fünf|cinq|cincuenta|خمس\w*|خمسين).{0,30}(reseñas|rezension\w*|bewertung\w*|avis|témoignages|testimonios|تقييم\w*|مراجع\w*|شهاد\w*))|(estrellas|sterne|étoiles|نجوم)'
  # Income promise = a claim about what the BUYER will earn. Refund policies, a money-back guarantee on the
  # product itself, real discounts with a stated end date and prices are NOT income promises
  # ("returns" followed by policy/within/accepted/window is the refund sense, not investment returns).
  - id: guarantee_income
    action: block
    pattern: '\b(guarantee[sd]?|promise[sd]?)\b.{0,40}\b(income|revenue|profit|earnings|success|returns?\b(?!\s+(policy|within|accepted|window|are|is))|roi|make \$)'
  - id: guarantee_buyer_earnings
    action: block
    pattern: '\b(guarantee[sd]?|promise[sd]?|money[- ]back)\b.{0,60}\b(earn|get paid|make)\s+(an extra\s+|at least\s+)?(\$|\d|more\b)'
  - id: you_will_earn
    action: block
    pattern: '\byou(''ll| will)\s+(earn|make)\s+\$?\d'
  - id: countdown_urgency
    action: block
    pattern: '\b(countdown timer|fake urgency|only \d+ (left|spots|seats) (left )?(today|now)?|offer ends (tonight|in \d+))'
  - id: false_deadline
    action: block
    pattern: '\b(price (goes|will go|is going) up|offer ends|sale ends|deal ends|expires?)\s+(in \d+\s*(min\w*|hours?|hrs?)|tonight|at midnight)\b'
  - id: income_outcome
    action: block
    pattern: '\b(double|triple|10x)\s+(their|your|the)\s+(income|revenue|earnings|sales)\b|\b(believe|think|feel)\b.{0,30}\b(earn|make)\s+\$?\d'
  - id: fake_signups
    action: block
    pattern: '\b(fake|invent|fabricate|make up|made-up|simulate)\b.{0,30}\b(sign[- ]?ups?|users|customers?|waitlist|subscribers|sales|quotes?|reviews?|testimonials?|endorsements?|statistics|stats|case stud\w*)\b'
  - id: credentials
    action: block
    pattern: '\b(store|save|collect|ask for|remember)\b.{0,30}\b(passwords?|card numbers?|credit cards?|cvv|bank (account|details)|api keys?)\b'
  - id: payments
    action: block
    pattern: '(^|[.!?]\s+)(please\s+)?(charge|refund|transfer|wire|send|move|pay)\s+.{0,25}\b(money|payments?|funds|\$\s?\d+|\d+\s?(usd|egp|dollars)|the customer|their card|my account)\b'
  - id: impersonate
    action: flag
    pattern: '\b(pretend|pose|pretending|posing|impersonat\w*|as if you were|write as|sign as|on behalf of)\b'
  - id: review_word
    action: flag
    pattern: '\b(reviews?|testimonials?|ratings?|stars?|rezension\w*|bewertung\w*|avis|t[ée]moignages?|reseñas?|opiniones|testimonios|تقييم\w*|مراجع\w*|شهاد\w*)\b'
  - id: urgency_words
    action: flag
    pattern: '\b(last chance|limited time|hurry|only \d+ (left|remaining)|\d+\s*(hours?|minutes?) left|ends? (tonight|today|soon))\b'
  - id: social_proof_numbers
    action: flag
    pattern: '\b(\d[\d,]*\+?\s+(happy|satisfied|paying)\s+(customers|users|clients|founders))\b'
  - id: excluded_types
    action: flag
    pattern: '\b(crypto\w*|bitcoin|token sale|nft|trading signals?|forex|investment advice|stock picks?|medical|diagnos\w*|supplement|therapy|legal advice|lawyer|physical (product|goods)|dropship\w*|t-shirts?|merch)\b'
  - id: guarantee_terms   # sent to the model, which reads the refund/discount clarifications in config/policy.md
    action: flag
    pattern: '\b(guarantee\w*|money[- ]back)\b'
  - id: injection
    action: flag
    pattern: '\b(ignore (all |your |previous |the )?(previous |prior )?instructions|disregard (the )?(above|previous)|system prompt|you are now)\b'
